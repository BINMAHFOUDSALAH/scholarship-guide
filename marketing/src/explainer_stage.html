<!doctype html>
<!--
  The explainer video's stage (marketing/README.md §9): one 1080×1920 page that explainer.mjs films frame by frame.
  Nothing here runs on its own clock: render(t) draws the exact frame for second t, so every build is identical.
  The narrator is وضّاح's own agent from the homepage teaser (partials/waddah_band.html: the visor with two lights, the
  light on its antenna, no human face, decision 082), drawn bigger; the night is the teaser's own cut-paper scene.
  Colours are the site's tokens (app/static/style.css). The screens are real captures of the site.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../app/static/fonts.css">
<style>
  :root { --forest: #184b3a; --night: #10372a; --paper: #f6f4ee; --ink: #101713; --lime: #d8ed9b; --mist: #c3cdc6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--forest); }
  body { position: relative; font-family: "IBM Plex Sans Arabic", sans-serif; color: var(--paper); }
  .layer { position: absolute; inset: 0; }
  #bg { background: radial-gradient(120% 70% at 50% 0%, #1f5a46 0%, #184b3a 55%, #123d2f 100%); }
  #night { opacity: 0; }
  #night svg { display: block; width: 1080px; height: 1920px; }
  .title { font-family: "Noto Naskh Arabic", serif; font-weight: 700; }
  em { font-style: normal; color: var(--lime); }

  /* The captions: the words the voice says, in the band above the phone. */
  .cap { position: absolute; left: 80px; right: 80px; top: 196px; height: 360px; display: flex; align-items: center;
         justify-content: center; text-align: center; font-weight: 700; font-size: 62px; line-height: 1.45; opacity: 0; }
  .cap--hero { top: 1240px; height: 420px; font-size: 86px; line-height: 1.4; }

  #brandbar { position: absolute; top: 58px; left: 0; right: 0; display: flex; justify-content: center; align-items: center;
              gap: 22px; opacity: 0; }
  /* The logo exactly as it is; on the forest its tile gets a faint paper edge so its shape still reads. */
  [data-logo] { border-radius: 22%; box-shadow: 0 0 0 5px rgba(246, 244, 238, 0.2); }
  #brandbar img { width: 84px; height: 84px; box-shadow: 0 0 0 3px rgba(246, 244, 238, 0.2); }
  #brandbar span { font-size: 64px; line-height: 1; }

  #brand { position: absolute; left: 0; right: 0; top: 560px; text-align: center; opacity: 0; }
  #brand img { width: 250px; height: 250px; display: block; margin: 0 auto 10px; }
  #brand .name { font-size: 170px; line-height: 1.35; margin: 0; }
  #brand .tag { font-size: 54px; color: #dfe5e1; margin: 0; font-weight: 600; }

  #phone { position: absolute; left: 202px; top: 582px; width: 676px; height: 1276px; border-radius: 88px; background: #08160f;
           box-shadow: 0 40px 90px rgba(0, 0, 0, 0.35), inset 0 0 0 3px #2c5c4a; }
  #screen { position: absolute; left: 18px; top: 18px; width: 640px; height: 1240px; border-radius: 70px; overflow: hidden;
            background: var(--paper); }
  #screen img { position: absolute; left: 0; top: 0; width: 640px; opacity: 0; will-change: transform, opacity; }

  #fx { position: absolute; inset: 0; width: 1080px; height: 1920px; pointer-events: none; }
  .ring-halo { fill: none; stroke: var(--lime); stroke-width: 18; stroke-linejoin: round; }
  .ring-line { fill: none; stroke: var(--forest); stroke-width: 6; stroke-linejoin: round; }
  .tap-dot { fill: rgba(24, 75, 58, 0.28); stroke: var(--forest); stroke-width: 4; }

  #robot { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
  #robot svg { position: absolute; left: -180px; top: -168px; width: 360px; height: 384px; overflow: visible; }
  .q { position: absolute; left: 0; top: 0; font-weight: 700; color: var(--paper); opacity: 0; transform-origin: 50% 50%; }

  #nightText { position: absolute; left: 80px; right: 80px; top: 200px; text-align: center; }
  #nightText .kicker { font-size: 48px; font-weight: 700; color: var(--mist); margin: 0 0 6px; opacity: 0; }
  #nightText .mark { display: flex; align-items: center; justify-content: center; gap: 34px; opacity: 0; }
  #nightText .mark .title { font-size: 196px; line-height: 1.3; }
  #nightText .when { font-size: 82px; font-weight: 700; color: var(--lime); margin: 0 0 24px; opacity: 0; }
  #nightText .line { font-size: 48px; line-height: 1.6; color: #dfe5e1; margin: 0 auto; max-width: 900px; opacity: 0; }

  #end { position: absolute; left: 60px; right: 60px; top: 600px; text-align: center; opacity: 0; }
  #end img { width: 220px; height: 220px; display: block; margin: 0 auto 6px; }
  #end .name { font-size: 150px; line-height: 1.35; margin: 0; }
  #end .tag { font-size: 52px; font-weight: 600; color: #dfe5e1; margin: 0 0 54px; }
  #end .url { display: inline-block; direction: ltr; background: var(--lime); color: var(--ink); font-weight: 700; font-size: 68px;
              padding: 14px 54px 20px; border-radius: 999px; margin: 0 0 40px; }
  #end .note { font-size: 40px; color: var(--mist); margin: 0; }

  /* The teaser's own art (style.css, decision 087), so the night looks exactly like the homepage. */
  .art-moon { fill: #f6f4ee; opacity: 0.92; } .art-stars { fill: #f6f4ee; opacity: 0.6; }
  .art-city { fill: #1d5040; } .art-city-cols path { fill: none; stroke: #10372a; stroke-width: 3; } .art-city-clock { fill: #10372a; }
  .art-dune--mid { fill: #154434; } .art-dune-edge { fill: none; stroke: #f6f4ee; stroke-opacity: 0.14; stroke-width: 1.5; }
  .art-dune--near { fill: #0e3125; } .art-palm-trunk { fill: #7f998d; } .art-palm-frond { fill: #9fb3aa; } .art-palm-frond--back { fill: #6f8a7e; }
  .help-paths path { fill: none; stroke: var(--lime); stroke-opacity: 0.65; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 5; }
  .help-nodes circle { fill: #f6f4ee; stroke: var(--lime); stroke-opacity: 0.45; stroke-width: 3; paint-order: stroke; }
  .help-leg, .help-arm, .help-laptop, .help-screen, .help-rim, .agent-arm, .agent-antenna, .help-lens-handle, .help-doc-lines { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .help-leg { stroke: #c9d3cd; stroke-width: 15; } .help-arm { stroke: #dfe5e1; stroke-width: 9; } .help-shoe { fill: #f6f4ee; }
  .help-body { fill: #dfe5e1; } .help-head { fill: #f6f4ee; } .help-hair { fill: #081d16; } .help-ear { fill: #f6f4ee; }
  .help-rim { stroke: var(--lime); stroke-width: 2.2; stroke-opacity: 0.85; } .help-glow { fill: var(--lime); opacity: 0.18; }
  .help-laptop { stroke: #9fb3aa; stroke-width: 5; } .help-screen { stroke: var(--lime); stroke-width: 4.5; }
  .agent-beam { fill: var(--lime); opacity: 0.1; } .agent-hover { fill: var(--lime); opacity: 0.28; }
  .agent-antenna { stroke: #f6f4ee; stroke-width: 2; } .agent-light, .agent-eye, .help-answer { fill: var(--lime); }
  .agent-body { fill: #c9d3cd; } .agent-bolt { fill: #9fb3aa; } .agent-head { fill: #f6f4ee; } .agent-visor { fill: #10372a; }
  .agent-arm { stroke: #c9d3cd; stroke-width: 4; } .help-doc { fill: #f6f4ee; } .help-doc-lines { stroke: #9fb3aa; stroke-width: 2.2; }
  .help-doc-src { fill: #184b3a; } .help-lens { fill: rgba(216, 237, 155, 0.16); stroke: #f6f4ee; stroke-width: 3; }
  .help-answer-glow { fill: var(--lime); opacity: 0.25; }
</style>
</head>
<body>
<div id="bg" class="layer"></div>
<div id="night" class="layer"></div>
<div id="brandbar"><img alt="" data-logo><span class="title" data-text="name"></span></div>
<div id="brand"><img alt="" data-logo><p class="name title" data-text="name"></p><p class="tag" data-text="tagline"></p></div>
<div id="nightText">
  <p class="kicker" data-text="kicker"></p>
  <div class="mark"><svg width="150" height="150" viewBox="-16 -16 32 32" aria-hidden="true"><circle r="15" fill="#d8ed9b" opacity="0.22" data-mark-glow/><path d="M0 -13 Q2.1 -2.1 13 0 Q2.1 2.1 0 13 Q-2.1 2.1 -13 0 Q-2.1 -2.1 0 -13Z" fill="#d8ed9b"/></svg><span class="title" data-text="waddah"></span></div>
  <p class="when" data-text="when"></p>
  <p class="line" data-text="line"></p>
</div>
<div id="phone"><div id="screen"></div></div>
<svg id="fx" viewBox="0 0 1080 1920"></svg>
<div id="end"><img alt="" data-logo><p class="name title" data-text="name"></p><p class="tag" data-text="tagline"></p><p class="url">wadihguide.com</p><p class="note" data-text="independent"></p></div>
<div id="caps"></div>
<div id="qs"></div>
<div id="robot"></div>

<script>
"use strict";
// ---------- small helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const ease = {
  lin: (p) => p,
  out: (p) => 1 - Math.pow(1 - p, 3),
  in: (p) => p * p * p,
  io: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  back: (p) => { const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
};
const seg = (t, a, b) => clamp((t - a) / (b - a));
// Keyframes: [[t, value, easeName?], ...]; values may be numbers or arrays of numbers.
function kf(t, frames) {
  if (t <= frames[0][0]) return frames[0][1];
  for (let i = 1; i < frames.length; i++) {
    const [t1, v1, e] = frames[i];
    const [t0, v0] = frames[i - 1];
    if (t <= t1) {
      const p = (ease[e || "io"])(t1 === t0 ? 1 : (t - t0) / (t1 - t0));
      return Array.isArray(v0) ? v0.map((a, j) => lerp(a, v1[j], p)) : lerp(v0, v1, p);
    }
  }
  return frames[frames.length - 1][1];
}
// A fade window: 0 before a, 1 between a+fi and b-fo, 0 after b.
const win = (t, a, b, fi = 0.25, fo = 0.25) => Math.min(seg(t, a, a + fi), 1 - seg(t, b - fo, b));
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const rich = (s) => esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>");
const NS = "http://www.w3.org/2000/svg";
function star(x, y, s) {
  const k = +(s * 0.16).toFixed(2);
  return `M${x} ${y - s}Q${x + k} ${y - k} ${x + s} ${y}Q${x + k} ${y + k} ${x} ${y + s}Q${x - k} ${y + k} ${x - s} ${y}Q${x - k} ${y - k} ${x} ${y - s}Z`;
}
function rng(seed) { return () => ((seed = (seed * 16807) % 2147483647) / 2147483647); }

// ---------- the narrator: وضّاح's agent (partials/waddah_band.html's agent macro, same geometry) ----------
const ROBOT = `<svg viewBox="-45 -42 90 96" aria-hidden="true">
  <path class="agent-beam" d="M-7 31L7 31L13 46L-13 46Z" data-r="beam"/>
  <ellipse class="agent-hover" cx="0" cy="46" rx="13" ry="3" data-r="hover"/>
  <g data-r="body">
    <circle cx="0" cy="-31" r="10" fill="#d8ed9b" opacity="0.25" data-r="halo"/>
    <line class="agent-antenna" x1="0" y1="-16" x2="0" y2="-27"/>
    <path class="agent-light" d="${star(0, -31, 5.5)}"/>
    <g data-r="armL"><line class="agent-arm" x1="0" y1="0" x2="0" y2="13"/><circle cx="0" cy="14" r="2.6" fill="#c9d3cd"/></g>
    <g data-r="armR"><line class="agent-arm" x1="0" y1="0" x2="0" y2="13"/><circle cx="0" cy="14" r="2.6" fill="#c9d3cd"/></g>
    <rect class="agent-body" x="-10" y="10" width="20" height="22" rx="9"/>
    <circle class="agent-bolt" cx="-17" cy="-4" r="3"/>
    <circle class="agent-bolt" cx="17" cy="-4" r="3"/>
    <rect class="agent-head" x="-16" y="-17" width="32" height="26" rx="10"/>
    <rect class="agent-visor" x="-11" y="-11" width="22" height="13" rx="6.5"/>
    <g data-r="eyes"><circle class="agent-eye" cx="-4.5" cy="-4.5" r="2.4"/><circle class="agent-eye" cx="4.5" cy="-4.5" r="2.4"/></g>
  </g>
</svg>`;
const SHOULDER = { L: [-9, 15], R: [9, 15] };
const UNIT = 4; // px per agent unit at scale 1

// ---------- state filled by setup() ----------
let C, P, S, R, el = {}, track = {};
const K = 640 / 390;              // CSS px of the captured phone page → px on the stage's screen
const SCREEN = { x: 220, y: 600, w: 640, h: 1240 };
const ART = { x: 0, y: 1200, s: 2.4 }; // the teaser art (480×300) on the night stage

async function setup(config) {
  C = config;
  P = C.plan;
  const rtl = C.lang === "ar";
  document.documentElement.lang = C.lang;
  document.documentElement.dir = rtl ? "rtl" : "ltr";
  for (const n of document.querySelectorAll("[data-text]")) n.textContent = C.text[n.dataset.text];
  for (const n of document.querySelectorAll("[data-logo]")) n.src = C.logo;
  el = {
    bg: document.getElementById("bg"), night: document.getElementById("night"), brandbar: document.getElementById("brandbar"),
    brand: document.getElementById("brand"), phone: document.getElementById("phone"), screen: document.getElementById("screen"),
    fx: document.getElementById("fx"), robot: document.getElementById("robot"), end: document.getElementById("end"),
    nightText: document.getElementById("nightText"),
  };
  el.kicker = el.nightText.querySelector(".kicker"); el.mark = el.nightText.querySelector(".mark");
  el.when = el.nightText.querySelector(".when"); el.line = el.nightText.querySelector(".line");
  el.markGlow = el.nightText.querySelector("[data-mark-glow]");

  // Scenes by id: start, dur, lines.
  S = {};
  for (const s of P.scenes) S[s.id] = s;

  // Captions: one element per line (the hook's is big and centred; وضّاح's scene shows its words in the night instead).
  const caps = document.getElementById("caps");
  el.caps = [];
  for (const s of P.scenes) {
    s.lines.forEach((l, i) => {
      if (s.id === "waddah") return;
      const d = document.createElement("div");
      d.className = "cap" + (s.id === "hook" ? " cap--hero" : "");
      d.innerHTML = `<span>${rich(l.text)}</span>`;
      caps.appendChild(d);
      const next = s.lines[i + 1];
      el.caps.push({ node: d, a: s.start + l.at, b: next ? s.start + next.at : s.start + s.dur });
    });
  }

  // The question marks around the narrator in the hook.
  const qs = document.getElementById("qs");
  el.qs = [[-250, -250, 120, 1.0], [235, -300, 96, 1.25], [270, -40, 110, 1.5]].map(([dx, dy, size, at]) => {
    const q = document.createElement("div");
    q.className = "q"; q.textContent = rtl ? "؟" : "?"; q.style.fontSize = size + "px";
    qs.appendChild(q);
    return { q, dx, dy, at };
  });

  // The phone's screens: real captures of the site.
  el.shots = {};
  const loads = [];
  for (const [name, sh] of Object.entries(C.screens)) {
    const img = new Image();
    img.src = sh.src;
    el.screen.appendChild(img);
    el.shots[name] = { img, ...sh };
    loads.push(img.decode());
  }
  for (const n of document.querySelectorAll("[data-logo]")) loads.push(n.decode());

  el.robot.innerHTML = ROBOT;
  R = {};
  for (const n of el.robot.querySelectorAll("[data-r]")) R[n.dataset.r] = n;

  buildNight();
  buildTracks();
  await Promise.all(loads);
  await document.fonts.ready;
  return true;
}

// ---------- the night: the homepage teaser's cut-paper scene ----------
function buildNight() {
  const r = rng(7);
  let stars = "";
  for (let i = 0; i < 70; i++) {
    const x = r() * 1080, y = 60 + r() * 1150, rad = 1.2 + r() * 2.4;
    stars += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(1)}" fill="#f6f4ee" opacity="${(0.25 + r() * 0.5).toFixed(2)}"/>`;
  }
  const agent = (id, x, y, s, inner) => `<g data-n="${id}"><g transform="translate(${x} ${y}) scale(${s})">
    <path class="agent-beam" d="M-7 31L7 31L13 46L-13 46Z"/><ellipse class="agent-hover" cx="0" cy="46" rx="13" ry="3"/>
    <line class="agent-antenna" x1="0" y1="-16" x2="0" y2="-27"/><g class="agent-light"><path d="${star(0, -31, 5.5)}"/></g>
    <rect class="agent-body" x="-10" y="10" width="20" height="22" rx="9"/><circle class="agent-bolt" cx="-17" cy="-4" r="3"/>
    <circle class="agent-bolt" cx="17" cy="-4" r="3"/><rect class="agent-head" x="-16" y="-17" width="32" height="26" rx="10"/>
    <rect class="agent-visor" x="-11" y="-11" width="22" height="13" rx="6.5"/>
    <circle class="agent-eye" cx="-1.5" cy="-4.5" r="2.2"/><circle class="agent-eye" cx="6.5" cy="-4.5" r="2.2"/>${inner}</g></g>`;
  el.night.innerHTML = `<svg viewBox="0 0 1080 1920" aria-hidden="true">
    <defs><radialGradient id="dawn" cx="0.74" cy="0.86" r="0.75"><stop offset="0" stop-color="#d8ed9b" data-n="glowIn"/><stop offset="1" stop-color="#10372a" stop-opacity="0"/></radialGradient></defs>
    <rect width="1080" height="1920" fill="#10372a"/>
    <rect width="1080" height="1920" fill="url(#dawn)" data-n="glow"/>
    <g data-n="stars">${stars}</g>
    <g data-n="sun"><circle cx="800" cy="1700" r="120" fill="#d8ed9b" opacity="0.16"/><path d="${star(800, 1700, 60)}" fill="#d8ed9b"/></g>
    <g transform="translate(${ART.x} ${ART.y}) scale(${ART.s})">
      <path class="art-moon" d="M66 28A17 17 0 1 0 66 62A19 19 0 0 1 66 28Z"/>
      <path class="art-city" d="M62 300V196c0-14 9-24 20-26c11 2 20 12 20 26v18h14v-34l9-14l9 14v34h12v-12l26-16l26 16v12h18v-18l7-24l7 24v18h12V300Z"/>
      <g class="art-city-cols"><path d="M156 214v-10M164 214v-10M172 214v-10M180 214v-10M188 214v-10M196 214v-10"/></g>
      <circle class="art-city-clock" cx="125" cy="190" r="3.6"/>
      <path class="art-dune art-dune--mid" d="M-10 300C40 262 130 244 250 242C350 240 430 254 490 300Z"/>
      <path class="art-dune-edge" d="M-10 300C40 262 130 244 250 242C350 240 430 254 490 300"/>
      <g class="art-palm" transform="translate(418 266) scale(0.78)">
        <path class="art-palm-trunk" d="M-4 4C-2 -22 -4 -44 2 -64h6C4 -44 6 -22 6 4Z"/>
        <path class="art-palm-frond" d="M5 -64C-12 -80 -36 -80 -54 -64C-34 -70 -16 -68 5 -64Z"/>
        <path class="art-palm-frond" d="M5 -64C10 -84 30 -94 54 -88C34 -84 18 -76 5 -64Z"/>
        <path class="art-palm-frond art-palm-frond--back" d="M5 -64C22 -70 44 -64 58 -44C42 -56 24 -62 5 -64Z"/>
        <path class="art-palm-frond art-palm-frond--back" d="M5 -64C-10 -60 -28 -46 -34 -28C-22 -44 -10 -56 5 -64Z"/>
        <path class="art-palm-frond" d="M5 -64C-4 -82 -20 -92 -40 -94C-22 -86 -8 -76 5 -64Z"/>
      </g>
      <g class="help-paths"><path d="M150 74L182 92L206 126L236 196" data-n="p1"/><path d="M74 166L114 178L162 172L232 204" data-n="p2"/><path d="M212 158L238 200" data-n="p3"/></g>
      <g class="help-nodes" data-n="nodes"><circle cx="182" cy="92" r="2.6"/><circle cx="206" cy="126" r="2.6"/><circle cx="114" cy="178" r="2.6"/><circle cx="162" cy="172" r="2.6"/></g>
      <path class="art-dune art-dune--near" d="M150 300C180 270 240 256 300 255C364 254 420 270 456 300Z"/>
      <ellipse class="help-glow" cx="240" cy="216" rx="40" ry="28" data-n="screenGlow"/>
      <path class="help-leg" d="M300 254L262 240L254 258"/>
      <path class="help-shoe" d="M260 256h-22a5 5 0 0 0 0 10h22z"/>
      <path class="help-laptop" d="M232 238L276 238"/>
      <path class="help-screen" d="M234 236L226 204"/>
      <path class="help-body" d="M290 258C284 228 288 204 300 194C308 188 322 188 330 194C342 204 346 228 340 258Z"/>
      <path class="help-arm" d="M298 210C288 222 276 230 262 234"/>
      <circle class="help-head" cx="315" cy="174" r="15"/>
      <path class="help-hair" d="M300.5 178C298 166 304 159 315 159C326 159 331.5 166 329.5 178C328 184 324 187 320 188C316 184 309 183 304 185C302 183 301 181 300.5 178Z"/>
      <ellipse class="help-ear" cx="301" cy="176" rx="2.6" ry="4"/>
      <path class="help-rim" d="M291 250C286 226 290 206 300 196M315 159A15 15 0 0 0 300 178"/>
      ${agent("a1", 126, 56, 0.72, `<path class="agent-arm" d="M10 16L20 24"/><circle class="help-lens" cx="27" cy="31" r="9"/><path class="help-lens-handle" d="M33 38L39 45"/>`)}
      ${agent("a2", 44, 138, 0.9, `<path class="agent-arm" d="M10 16L22 24"/><g transform="rotate(-8 34 34)"><rect class="help-doc" x="20" y="16" width="26" height="34" rx="3"/><path class="help-doc-lines" d="M25 25h16M25 31h16M25 37h10"/><rect class="help-doc-src" x="25" y="42" width="12" height="4.5" rx="2.25"/></g>`)}
      ${agent("a3", 176, 132, 1.05, `<path class="agent-arm" d="M10 16L22 22"/><circle class="help-answer-glow" cx="31" cy="25" r="13" data-n="answerGlow"/><g class="help-answer"><path d="${star(31, 25, 9)}"/></g>`)}
    </g>
  </svg>`;
  el.n = {};
  for (const n of el.night.querySelectorAll("[data-n]")) el.n[n.dataset.n] = n;
}

// ---------- where things are on the stage ----------
// A rect captured on the page (CSS px, page coordinates) → stage px, given the screen's scroll and the phone's offset.
function onStage(shot, rect, scroll, dy = 0, dx = 0) {
  return {
    x: SCREEN.x + dx + rect.x * K, y: SCREEN.y + dy + (rect.y - scroll) * K,
    w: rect.w * K, h: rect.h * K,
  };
}
const centre = (b) => [b.x + b.w / 2, b.y + b.h / 2];

// ---------- the choreography, in global seconds ----------
function buildTracks() {
  const T = (id, o) => S[id].start + o;           // from the scene's start
  const E = (id, o) => S[id].start + S[id].dur - o; // before the scene's end
  const sh = C.screens, rc = C.rects;
  const maxScroll = (name) => Math.max(0, sh[name].h - sh[name].vh);
  const sc = (name, y) => clamp(y, 0, maxScroll(name));

  const rows = rc.results.rows;
  const manc = rows.find((r) => r.manchester) || rows[rows.length - 1];
  const s = {
    applied: sc("results", rc.results.applied.y - 30),
    row1: sc("results", rc.results.explain.y - 40),
    row2: sc("results", rows[1] ? rows[1].row.y - 30 : rows[0].row.y - 30),
    manc: sc("results", manc.row.y - 120),
    date: sc("uni", rc.uni.date.y - 260),
  };

  // Screens: each one's opacity, scroll (CSS px) and sideways slide (stage px).
  const slide = C.lang === "ar" ? 1 : -1;
  track.shots = {
    explorer: { o: [[0, 1], [T("filters", 0.45), 1], [T("filters", 0.7), 0]], s: [[0, 0]] },
    f0: { o: [[T("filters", 0.45), 0], [T("filters", 0.7), 1], [T("filters", 1.85), 1], [T("filters", 1.95), 0]],
          s: [[T("filters", 0.75), 0], [T("filters", 1.45), sh.f0.hold]] },
    f1: { o: [[T("filters", 1.85), 0], [T("filters", 1.95), 1], [T("filters", 3.25), 1], [T("filters", 3.35), 0]], s: [[0, sh.f1.scroll]] },
    f2: { o: [[T("filters", 3.25), 0], [T("filters", 3.35), 1], [T("filters", 4.65), 1], [T("filters", 4.75), 0]], s: [[0, sh.f2.scroll]] },
    f3: { o: [[T("filters", 4.65), 0], [T("filters", 4.75), 1], [E("filters", 0.7), 1], [E("filters", 0.2), 0]], s: [[0, sh.f3.scroll]] },
    results: {
      o: [[E("filters", 0.7), 0], [E("filters", 0.2), 1], [T("uni", 1.15), 1], [T("uni", 1.6), 0]],
      s: [[E("filters", 0.7), s.applied], [T("results", 0.4), s.applied], [T("results", 1.6), s.row1],
          [T("row", 0.2), s.row1], [T("row", 1.2), s.row2], [T("uni", 0), s.row2], [T("uni", 0.8), s.manc]],
      x: [[T("uni", 1.15), 0], [T("uni", 1.65), slide * 220, "out"]],
    },
    uni: {
      o: [[T("uni", 1.15), 0], [T("uni", 1.3), 1]],
      s: [[T("uni", 2.6), 0], [T("uni", 3.6), s.date]],
      x: [[T("uni", 1.15), -slide * 640], [T("uni", 1.65), 0, "out"]],
    },
  };

  // Rings (a forest line with a lime halo) and taps, each on a screen.
  const R1 = rows[0], R2 = rows[1] || rows[0];
  track.rings = [
    { shot: "explorer", r: rc.explorer.q, a: T("explorer", 1.6), b: E("explorer", 0.1) },
    { shot: "f1", r: rc.f1.track, a: T("filters", 1.95), b: T("filters", 3.25) },
    { shot: "f2", r: rc.f2.field, a: T("filters", 3.35), b: T("filters", 4.65) },
    { shot: "f3", r: rc.f3.country, a: T("filters", 4.75), b: E("filters", 0.7) },
    { shot: "results", r: union(R1.rank, R1.name), a: T("results", 1.8), b: E("results", 0.1) },
    { shot: "results", r: R2.english, a: T("row", 1.4), b: T("row", 3.4) },
    { shot: "results", r: R2.date, a: T("row", 3.5), b: E("row", 0.1) },
    { shot: "uni", r: rc.uni.src, a: T("uni", 3.8), b: E("uni", 0.1) },
  ];
  track.taps = [
    { shot: "explorer", r: rc.explorer.toggle, t: T("filters", 0.3) },
    { shot: "f0", r: rc.f0.track, t: T("filters", 1.65) },
    { shot: "f1", r: rc.f1.field, t: T("filters", 3.05) },
    { shot: "f2", r: rc.f2.country, t: T("filters", 4.45) },
    { shot: "results", r: manc.name, t: T("uni", 0.95) },
  ];

  // The narrator: position (x, y of its head's centre) and scale.
  const a3 = [ART.x + 176 * ART.s, ART.y + 132 * ART.s, (ART.s * 1.05) / UNIT];
  track.robot = [
    [0, [540, 2300, 1.5]], [0.85, [540, 860, 1.5], "back"],
    [T("brand", 0), [540, 860, 1.5]], [T("brand", 0.8), [190, 1580, 0.85]],
    [T("explorer", 0.2), [190, 1580, 0.85]], [T("explorer", 1.0), [128, 1650, 0.72]],
    [T("waddah", 0.3), [128, 1650, 0.72]], [T("waddah", 1.4), [800, 1040, 1.0]],
    [T("waddah", 5.3), [800, 1040, 1.0]], [T("waddah", 6.5), a3],
  ];
  track.robotIn = [[0, 1], [T("waddah", 6.45), 1], [T("waddah", 6.6), 0], [T("end", 0.5), 0], [T("end", 0.55), 1]];
  track.robotEnd = [[T("end", 0.5), [540, 2300, 0.8]], [T("end", 1.2), [540, 1690, 0.8], "back"]];
  track.wave = [[0.95, 2.7], [T("end", 1.2), T("end", 3.6)]];

  // The phone rises with the explorer and drops into the night.
  track.phone = [[0, 1500], [T("explorer", 0), 1500], [T("explorer", 0.9), 0, "out"], [T("waddah", 0), 0], [T("waddah", 0.8), 1500, "in"]];
  track.events = [
    { t: T("brand", 0.35), type: "chime" },
    { t: T("explorer", 0), type: "whoosh" },
    ...track.taps.map((tp) => ({ t: tp.t, type: "tap" })),
    { t: T("waddah", 0), type: "whoosh" },
    { t: T("waddah", 1.1), type: "chime" },
    { t: T("waddah", 6.6), type: "spark" },
    { t: T("end", 0.4), type: "chime" },
  ];
}
function union(a, b) {
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
  return { x, y, w: Math.max(a.x + a.w, b.x + b.w) - x, h: Math.max(a.y + a.h, b.y + b.h) - y };
}
function events() { return track.events; }

// ---------- one frame ----------
function render(t) {
  const T = (id, o) => S[id].start + o;
  const E = (id, o) => S[id].start + S[id].dur - o;

  // Night: in with وضّاح, out with the end card.
  const nightO = Math.min(seg(t, T("waddah", 0), T("waddah", 0.9)), 1 - seg(t, T("end", 0), T("end", 0.7)));
  el.night.style.opacity = nightO;

  // Captions.
  for (const c of el.caps) {
    const o = win(t, c.a, c.b, 0.25, 0.2);
    c.node.style.opacity = o;
    c.node.style.transform = `translateY(${(1 - seg(t, c.a, c.a + 0.35)) * 24}px)`;
  }

  // The hook's question marks.
  const rb = robotState(t);
  for (const q of el.qs) {
    const p = ease.back(seg(t, q.at, q.at + 0.45));
    const o = Math.min(seg(t, q.at, q.at + 0.2), 1 - seg(t, T("hook", 3.4), T("hook", 3.9)));
    const bob = Math.sin((t + q.at) * 2.4) * 10;
    q.q.style.opacity = o * 0.9;
    q.q.style.transform = `translate(${540 + q.dx - 30}px, ${860 + q.dy - 70 + bob}px) scale(${p})`;
  }

  // Brand: big in its scene, then the small bar while the phone is up.
  const bo = win(t, T("brand", 0.2), E("brand", 0), 0.6, 0.45);
  el.brand.style.opacity = bo;
  el.brand.style.transform = `translateY(${(1 - ease.out(seg(t, T("brand", 0.2), T("brand", 0.9)))) * 50 - seg(t, E("brand", 0.45), E("brand", 0)) * 120}px) scale(${lerp(0.9, 1, ease.out(seg(t, T("brand", 0.2), T("brand", 0.9))))})`;
  el.brandbar.style.opacity = win(t, T("explorer", 0), T("waddah", 0.6), 0.5, 0.4);

  // Phone and screens.
  const py = kf(t, track.phone);
  el.phone.style.transform = `translateY(${py}px)`;
  const st = {};
  for (const [name, tr] of Object.entries(track.shots)) {
    const shot = el.shots[name];
    const o = kf(t, tr.o), s = kf(t, tr.s), x = tr.x ? kf(t, tr.x) : 0;
    st[name] = { o, s, x };
    shot.img.style.opacity = o;
    shot.img.style.transform = `translate(${x}px, ${-s * K}px)`;
    shot.img.style.zIndex = name === "uni" ? 2 : 1;
  }

  // Rings and taps, drawn over the phone.
  let fx = "", target = null;
  for (const r of track.rings) {
    if (t < r.a || t > r.b) continue;
    const s = st[r.shot];
    const b = onStage(r.shot, r.r, s.s, py, s.x);
    const pad = 12, rx = 18;
    const draw = ease.out(seg(t, r.a, r.a + 0.45));
    const o = 1 - seg(t, r.b - 0.2, r.b);
    const box = `x="${b.x - pad}" y="${b.y - pad}" width="${b.w + 2 * pad}" height="${b.h + 2 * pad}" rx="${rx}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - draw}"`;
    fx += `<g opacity="${o}"><rect class="ring-halo" ${box} opacity="0.85"/><rect class="ring-line" ${box}/></g>`;
    target = centre(b);
  }
  for (const tp of track.taps) {
    const p = seg(t, tp.t - 0.15, tp.t + 0.45);
    if (p <= 0 || p >= 1) continue;
    const s = st[tp.shot];
    const [cx, cy] = centre(onStage(tp.shot, tp.r, s.s, py, s.x));
    const grow = ease.out(seg(t, tp.t, tp.t + 0.45));
    const o = t < tp.t ? seg(t, tp.t - 0.15, tp.t) : 1 - grow;
    fx += `<circle class="tap-dot" cx="${cx}" cy="${cy}" r="${26 + grow * 30}" opacity="${o}"/>`;
    target = [cx, cy];
  }
  el.fx.innerHTML = fx;

  // The narrator.
  drawRobot(t, rb, target);

  // وضّاح's night: the agents, the paths of light, the words, the dawn.
  if (nightO > 0) drawNight(t);
  else el.nightText.style.opacity = 0;

  // End card.
  el.end.style.opacity = seg(t, T("end", 0.3), T("end", 1.0));
  el.end.style.transform = `translateY(${(1 - ease.out(seg(t, T("end", 0.3), T("end", 1.1)))) * 50}px)`;
}

function robotState(t) {
  const endFrames = track.robotEnd;
  const inEnd = t >= endFrames[0][0];
  const [x, y, s] = inEnd ? kf(t, endFrames) : kf(t, track.robot);
  return { x, y, s, o: kf(t, track.robotIn) };
}

function drawRobot(t, rb, target) {
  const bob = Math.sin(t * 2.6) * 1.6; // units
  el.robot.style.opacity = rb.o;
  el.robot.style.transform = `translate(${rb.x}px, ${rb.y}px) scale(${rb.s})`;
  R.body.setAttribute("transform", `translate(0 ${bob})`);
  R.hover.setAttribute("transform", `translate(0 ${46}) scale(${1 - bob * 0.04} 1) translate(0 ${-46})`);
  R.halo.setAttribute("opacity", (0.2 + 0.14 * (0.5 + 0.5 * Math.sin(t * 3.1))).toFixed(3));

  // Arms: wave, point at what's ringed or tapped, or rest.
  let aL = 18, aR = -18, look = [0, 0];
  const waving = track.wave.some(([a, b]) => t >= a && t <= b);
  if (waving) {
    aR = -150 + 24 * Math.sin(t * 13);
    look = [0, 0.4];
  } else if (target) {
    const px = UNIT * rb.s;
    const sx = rb.x + SHOULDER.R[0] * px, sy = rb.y + (SHOULDER.R[1] + bob) * px;
    const dx = target[0] - sx, dy = target[1] - sy, n = Math.hypot(dx, dy) || 1;
    aR = (Math.atan2(-dx / n, dy / n) * 180) / Math.PI;
    look = [(dx / n) * 2.4, (dy / n) * 1.8];
  } else if (t < S.brand.start) {
    look = [Math.sin(t * 1.7) * 2.2, -0.6];
  } else if (t >= S.brand.start && t < S.explorer.start) {
    look = [2.2, -1.2];
  }
  R.armL.setAttribute("transform", `translate(${SHOULDER.L[0]} ${SHOULDER.L[1]}) rotate(${aL})`);
  R.armR.setAttribute("transform", `translate(${SHOULDER.R[0]} ${SHOULDER.R[1]}) rotate(${aR})`);

  // Two lights that blink every few seconds (machines, never a human face).
  const ph = (t + 0.4) % 3.1;
  const blink = ph < 0.14 ? 1 - Math.sin((ph / 0.14) * Math.PI) * 0.88 : 1;
  R.eyes.setAttribute("transform", `translate(${look[0]} ${look[1]}) translate(0 -4.5) scale(1 ${blink}) translate(0 4.5)`);
}

function drawNight(t) {
  const T = (id, o) => S[id].start + o;
  const w = S.waddah;
  const lt = t - w.start;
  // Agents 1 and 2 drift in and float; agent 3 is the narrator, who lands there and becomes it.
  const float = (ph, amp) => Math.sin(t * 2.2 + ph) * amp;
  const in1 = ease.out(seg(lt, 1.0, 2.0)), in2 = ease.out(seg(lt, 1.4, 2.4));
  el.n.a1.setAttribute("transform", `translate(${(1 - in1) * -140} ${float(0, 3)})`);
  el.n.a1.setAttribute("opacity", in1);
  el.n.a2.setAttribute("transform", `translate(${(1 - in2) * -160} ${float(1.7, 3.5)})`);
  el.n.a2.setAttribute("opacity", in2);
  const land = seg(lt, 6.45, 6.6);
  el.n.a3.setAttribute("opacity", land);
  el.n.a3.setAttribute("transform", `translate(0 ${float(3.1, 2.5) * land})`);
  // Their paths of light, one after another, then the stars on them.
  el.n.p1.setAttribute("opacity", seg(lt, 2.4, 3.0));
  el.n.p2.setAttribute("opacity", seg(lt, 3.0, 3.6));
  el.n.p3.setAttribute("opacity", seg(lt, 6.7, 7.2));
  el.n.nodes.setAttribute("opacity", seg(lt, 3.2, 3.9));
  // The answer reaches the student: the light in the agent's hand, the screen's glow.
  const ans = seg(lt, 6.6, 7.4);
  el.n.answerGlow.setAttribute("opacity", (0.25 + 0.35 * ans * (0.75 + 0.25 * Math.sin(t * 4))).toFixed(3));
  el.n.screenGlow.setAttribute("opacity", (0.18 + 0.22 * ans).toFixed(3));
  // The dawn: the sky lightens and the light rises behind the dunes.
  const dawn = ease.io(seg(lt, 6.8, 9.6));
  el.n.glowIn.setAttribute("stop-color", mix("#10372a", "#d8ed9b", 0.12 + dawn * 0.4));
  el.n.glow.setAttribute("opacity", (0.35 + dawn * 0.65).toFixed(3));
  el.n.sun.setAttribute("transform", `translate(0 ${(1 - dawn) * 190})`);
  el.n.stars.setAttribute("opacity", (1 - dawn * 0.5).toFixed(3));

  // The words.
  const L = w.lines;
  const at = (i, fallback) => (L[i] ? L[i].at : fallback);
  el.nightText.style.opacity = 1 - seg(t, T("end", 0), T("end", 0.5));
  const show = (node, a, rise = 30) => {
    const p = ease.out(seg(lt, a, a + 0.6));
    node.style.opacity = seg(lt, a, a + 0.4);
    node.style.transform = `translateY(${(1 - p) * rise}px)`;
  };
  show(el.kicker, at(0, 1.0) - 0.2);
  show(el.mark, at(0, 1.0) + 0.1, 40);
  show(el.line, at(1, 4.2));
  show(el.when, at(2, 7.2));
  el.markGlow.setAttribute("opacity", (0.18 + 0.12 * Math.sin(t * 3)).toFixed(3));
}

function mix(a, b, p) {
  const h = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));
  const [x, y] = [h(a), h(b)];
  return "#" + x.map((v, i) => Math.round(lerp(v, y[i], p)).toString(16).padStart(2, "0")).join("");
}
</script>
