    <path d="M-20 4L-44 56h18L24 6z" fill="#f6f4ee"/>
    <path d="M-20-4L-44-50h18L24-6z" fill="#9fe0d8"/>
    <path d="M-72-4l-16-26h14L-48-4z" fill="#f6f4ee"/>
    <path d="M-72 4l-14 20h12L-50 4z" fill="#9fe0d8"/>
