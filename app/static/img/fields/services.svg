    <ellipse cx="320" cy="170" rx="74" ry="150"/>
    <path d="M170 170H470M186 104H454M186 236H454"/>
  </g>
  <path d="M0 278h640v127H0z" fill="#094f4f"/>
  <!-- the route -->
  <path d="M104 122C176 36 330 22 462 62" fill="none" stroke="#9fe0d8" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 17"/>
  <!-- the map pin -->
