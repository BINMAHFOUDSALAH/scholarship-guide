<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -85 640 490" width="640" height="490">
  <!-- Field illustration (decision 073): paper cut-outs on the field's own colour (its .tone-services palette in style.css). Tourism, sport and transport: a plane on its route, a map pin, a suitcase, a ball, a train. -->
  <rect y="-85" width="640" height="490" fill="#0d6b6a"/>
  <!-- the globe behind -->
  <g fill="none" stroke="#f6f4ee" stroke-opacity=".1" stroke-width="2.5">
