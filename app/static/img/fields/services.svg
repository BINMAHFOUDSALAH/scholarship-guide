    <rect x="-80" y="-76" width="160" height="140" rx="14" fill="#f6f4ee"/>
    <rect x="-54" y="-76" width="16" height="140" fill="#9fe0d8"/>
    <rect x="38" y="-76" width="16" height="140" fill="#9fe0d8"/>
    <rect x="-22" y="-44" width="44" height="30" rx="4" fill="#2a8a87"/>
    <path d="M-12-29H12" stroke="#f6f4ee" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-54" cy="70" r="9" fill="#094f4f" stroke="#f6f4ee" stroke-width="3"/>
    <circle cx="54" cy="70" r="9" fill="#094f4f" stroke="#f6f4ee" stroke-width="3"/>
