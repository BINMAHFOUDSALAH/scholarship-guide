<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -85 640 490" width="640" height="490">
  <!-- Field illustration (decision 073): paper cut-outs on the logo's forest tile. Health: a heart, a pulse, a stethoscope. -->
  <rect y="-85" width="640" height="490" fill="#184b3a"/>
  <circle cx="310" cy="160" r="128" fill="#2a6a53" opacity=".55"/>
  <!-- the heart -->
  <path d="M310 276C224 212 182 170 182 118c0-40 30-68 66-68 26 0 48 14 62 38 14-24 36-38 62-38 36 0 66 28 66 68 0 52-42 94-128 158z" fill="#f6f4ee"/>
  <!-- the pulse runs through it, from edge to edge -->
  <path d="M0 158H208l22-44 34 96 34-132 30 104 18-24h40" fill="none" stroke="#184b3a" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M0 158H176" fill="none" stroke="#9ad3b4" stroke-width="8" stroke-linecap="round"/>
  <path d="M446 158H640" fill="none" stroke="#9ad3b4" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 20"/>
  <!-- the stethoscope -->
  <g fill="none" stroke="#9ad3b4" stroke-width="9" stroke-linecap="round">
    <path d="M506 42v62c0 26-24 42-48 42"/>
    <path d="M566 42v62c0 44-34 74-68 80"/>
    <path d="M498 184c-22 4-34 22-34 44v12"/>
  </g>
  <circle cx="506" cy="36" r="9" fill="#f6f4ee"/>
  <circle cx="566" cy="36" r="9" fill="#f6f4ee"/>
  <circle cx="464" cy="262" r="28" fill="#f6f4ee"/>
  <circle cx="464" cy="262" r="14" fill="#2a6a53"/>
  <!-- the cross -->
  <g transform="translate(96 72)">
    <rect x="-40" y="-40" width="80" height="80" rx="16" fill="#d8ed9b"/>
    <path d="M-9-26H9V-9H26V9H9V26H-9V9H-26V-9H-9z" fill="#184b3a"/>
  </g>
  <!-- the capsule -->
  <g transform="translate(106 252) rotate(-32)">
    <rect x="-48" y="-19" width="96" height="38" rx="19" fill="#f6f4ee"/>
    <path d="M0-19h29a19 19 0 0 1 0 38H0z" fill="#9ad3b4"/>
  </g>
</svg>
