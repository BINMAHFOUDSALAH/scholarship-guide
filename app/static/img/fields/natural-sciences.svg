<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -85 640 490" width="640" height="490">
  <!-- Field illustration (decision 073): paper cut-outs on the field's own colour (its .tone-natural-sciences palette in style.css). Science: a flask, an atom, a planet, DNA. -->
  <rect y="-85" width="640" height="490" fill="#5a3596"/>
  <circle cx="320" cy="176" r="124" fill="#7853b5" opacity=".55"/>
  <!-- stars -->
  <g fill="#f6f4ee">
    <circle cx="42" cy="48" r="3"/><circle cx="110" cy="28" r="2.5"/><circle cx="214" cy="40" r="3"/><circle cx="238" cy="96" r="2.5"/>
    <circle cx="412" cy="36" r="3"/><circle cx="596" cy="168" r="3"/><circle cx="36" cy="270" r="3"/><circle cx="604" cy="284" r="2.5"/><circle cx="430" cy="102" r="2.5"/>
    <circle cx="74" cy="-40" r="3"/><circle cx="168" cy="-62" r="2.5"/><circle cx="286" cy="-30" r="3"/><circle cx="392" cy="-66" r="2.5"/><circle cx="520" cy="-34" r="3"/><circle cx="610" cy="-60" r="2.5"/>
    <circle cx="90" cy="356" r="3"/><circle cx="190" cy="330" r="2.5"/><circle cx="300" cy="372" r="3"/><circle cx="420" cy="340" r="2.5"/><circle cx="540" cy="378" r="3"/>
  </g>
  <!-- the flask -->
  <path d="M296 62h48v74l66 112a22 22 0 0 1-19 33H249a22 22 0 0 1-19-33l66-112z" fill="#f6f4ee"/>
  <path d="M274 186h92l44 66a19 19 0 0 1-16 29H246a19 19 0 0 1-16-29z" fill="#cfbef3"/>
  <rect x="284" y="50" width="72" height="18" rx="6" fill="#f6f4ee"/>
  <g fill="#5a3596">
    <circle cx="290" cy="244" r="11"/>
    <circle cx="340" cy="222" r="8"/>
    <circle cx="358" cy="256" r="13"/>
    <circle cx="316" cy="264" r="5"/>
  </g>
  <rect x="296" y="96" width="24" height="5" rx="2.5" fill="#5a3596"/>
  <rect x="296" y="114" width="16" height="5" rx="2.5" fill="#5a3596"/>
  <!-- what rises from it -->
  <circle cx="320" cy="30" r="9" fill="#ffe27a"/>
  <circle cx="346" cy="16" r="5" fill="#ffe27a"/>
  <!-- the atom -->
  <g transform="translate(128 150)" fill="none" stroke="#f6f4ee" stroke-width="4.5">
    <ellipse rx="74" ry="28"/>
    <ellipse rx="74" ry="28" transform="rotate(60)"/>
    <ellipse rx="74" ry="28" transform="rotate(120)"/>
    <circle r="13" fill="#ffe27a" stroke="none"/>
    <circle cx="74" r="7" fill="#cfbef3" stroke="none"/>
    <circle cx="-37" cy="-64" r="7" fill="#cfbef3" stroke="none"/>
  </g>
  <!-- the planet -->
  <g transform="translate(508 76)">
    <circle r="36" fill="#cfbef3"/>
    <path d="M-34-10c20 8 46 8 68 0" fill="none" stroke="#5a3596" stroke-width="4" stroke-opacity=".5"/>
    <path d="M-35 10c20 8 48 8 70 0" fill="none" stroke="#5a3596" stroke-width="4" stroke-opacity=".5"/>
    <ellipse rx="62" ry="15" fill="none" stroke="#f6f4ee" stroke-width="4.5" transform="rotate(-16)"/>
  </g>
  <!-- DNA -->
  <g transform="translate(510 168)" fill="none" stroke-linecap="round">
    <path d="M-26 0c0 22 52 22 52 44s-52 22-52 44 52 22 52 44" stroke="#f6f4ee" stroke-width="5"/>
    <path d="M26 0c0 22-52 22-52 44s52 22 52 44-52 22-52 44" stroke="#cfbef3" stroke-width="5"/>
    <path d="M-20 10H20M-20 34H20M-20 54H20M-20 78H20M-20 98H20M-20 122H20" stroke="#f6f4ee" stroke-width="3" stroke-opacity=".6"/>
