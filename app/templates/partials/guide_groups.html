{# The guides in groups (decision 062), from data/home.json: the homepage, «الأدلة» and the footer list the same ones. #}
<div class="guide-groups">
  {% for group in guide_groups %}
  <div class="guide-group">
    <h3 class="guide-group-title">{{ group.title_ar }}</h3>
    <ul class="guide-list">
      {% for item in group["items"] %}
      <li><a class="guide-link" href="{{ url_for('resource_page', slug=item.slug) }}"><span class="guide-name">{{ item.title_ar }}</span><span class="guide-hint">{{ item.hint_ar }}</span></a></li>
      {% endfor %}
    </ul>
  </div>
  {% endfor %}
</div>
