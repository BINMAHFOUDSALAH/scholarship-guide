<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.name }} | {{ site.tagline }}{% endblock %}</title>
  <link rel="preload" href="{{ url_for('static', path='fonts/ibm-plex-sans-arabic-arabic-400.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', path='fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-name" href="{{ url_for('home') }}">{{ site.name }}</a>
      <nav>
        <a href="{{ url_for('home') }}">الرئيسية</a>
        <a href="{{ url_for('about') }}">عن الدليل</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>هذا دليل طلابي مستقل. ليس وزارة التعليم وليس منصة سفير.</p>
    </div>
  </footer>
</body>
</html>
