{% extends "base.html" %}

{% block title %}{{ _("الصفحة غير موجودة |") }} {{ site.name }}{% endblock %}

{% block content %}
<div class="measure">
<h1>{{ _("الصفحة غير موجودة") }}</h1>
<p class="lead">{{ _("ربما تغيّر الرابط أو كُتب بشكل خاطئ.") }}</p>
<form class="not-found-search" method="get" action="{{ url_for('search_page') }}" role="search" aria-label="{{ _('البحث في الدليل') }}">
  <label class="field-label" for="nf-q">{{ _("ابحث في الدليل") }}</label>
  <div class="site-search-row">
    <input class="input" type="search" id="nf-q" name="q" maxlength="200">
    <button class="btn btn--primary" type="submit">{{ _("ابحث") }}</button>
  </div>
</form>
<p><a href="{{ url_for('home') }}">{{ _("→ الرجوع إلى الرئيسية") }}</a></p>
</div>
{% endblock %}
